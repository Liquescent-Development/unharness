[package]
name = "unharness"
version = "0.2.0"
edition = "2024"
authors = ["Richard Kiene <richard@liquescent.dev>"]
description = "A vendor-neutral TUI and CLI runner for AI coding agents"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
colored = "2.1"
anyhow = "1.0"
dirs = "5.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
