[package]
name = "unharness"
version = "0.4.0"
edition = "2024"
authors = ["Richard Kiene <richard@liquescent.dev>"]
description = "A vendor-neutral TUI and CLI runner for AI coding agents"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/Liquescent-Development/unharness"
homepage = "https://github.com/Liquescent-Development/unharness"
readme = "README.md"
keywords = ["ai", "agents", "tui", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
colored = "2.1"
anyhow = "1.0"
dirs = "5.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
axoupdater = "0.10"
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-segmentation = "1.13.3"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
